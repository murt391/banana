
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">
    
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color, #191919);
            color: var(--text-color, #ffffff);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* App Layout */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            height: 100%;
            background: rgba(25, 25, 25, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 20;
            backdrop-filter: blur(12px);
        }

        .sidebar.collapsed {
            transform: translateX(-260px);
        }

        .sidebar-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .new-chat-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: inherit;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s ease;
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.7);
            transition: background 0.15s ease, color 0.15s ease;
            position: relative;
            group: true;
        }

        .chat-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
        }

        .chat-item.active {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            font-weight: 500;
        }

        .chat-item-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 8px;
        }

        .chat-item-delete {
            opacity: 0;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: opacity 0.15s ease, color 0.15s ease;
        }

        .chat-item:hover .chat-item-delete {
            opacity: 1;
        }

        .chat-item-delete:hover {
            color: #ff5555;
        }

        /* Main Chat Area */
        .main-chat {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg-color, #191919);
        }

        .chat-header-bar {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 10;
        }

        .toggle-sidebar-btn, .top-settings-btn {
            background: rgba(35, 35, 35, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: inherit;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .toggle-sidebar-btn:hover, .top-settings-btn:hover {
            transform: scale(1.08);
            background: rgba(255, 255, 255, 0.15);
        }

        /* Messages Container */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 750px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            gap: 16px;
            padding: 4px 0;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            padding: 12px 18px;
            border-radius: 14px;
            max-width: 85%;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-bubble {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-bubble {
            background: transparent;
            padding: 0;
            color: inherit;
            width: 100%;
        }

        /* Empty State */
        .empty-chat-state {
            margin: auto;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.2rem;
        }

        /* Input Bar */
        .input-area-wrapper {
            padding: 20px 24px 24px 24px;
            display: flex;
            justify-content: center;
            background: linear-gradient(to top, var(--bg-color, #191919) 70%, transparent);
            z-index: 30;
        }

        .input-box {
            max-width: 750px;
            width: 100%;
            background: rgba(35, 35, 35, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            display: flex;
            align-items: flex-end;
            padding: 10px 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: inherit;
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            max-height: 150px;
            min-height: 24px;
            padding: 4px 0;
            outline: none;
            line-height: 1.5;
        }

        .send-btn {
            background: #ffffff;
            color: #191919;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: 10px;
            flex-shrink: 0;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .send-btn:hover {
            transform: scale(1.1);
            background: #e0e0e0;
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* Settings Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #222222;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            width: 500px;
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px;
        }

        .modal-close:hover {
            color: #fff;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
        }

        .form-group select, .form-group textarea, .form-group input {
            background: #191919;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 10px 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 90px;
        }

        .form-group select:focus, .form-group textarea:focus, .form-group input:focus {
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Markdown formatting styles */
        pre {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid rgba(255,255,255,0.1);
            margin: 8px 0;
        }
        code {
            font-family: SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;
            font-size: 0.85em;
        }
        p {
            margin: 0 0 10px 0;
        }
        p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" id="newChatBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New Chat
                </button>
            </div>
            <div class="chat-list" id="chatList">
                <!-- Dynamic Chat History Items -->
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="main-chat">
            <div class="chat-header-bar">
                <button class="toggle-sidebar-btn" id="toggleSidebarBtn" aria-label="Toggle Sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <button class="top-settings-btn" id="openSettingsBtn" aria-label="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="empty-chat-state" id="emptyState">Send a message to start chatting</div>
            </div>

            <div class="input-area-wrapper">
                <div class="input-box">
                    <textarea id="userInput" placeholder="Type a message..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn" aria-label="Send Message">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <span>Settings</span>
                <button class="modal-close" id="closeSettingsBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="personalityPreset">AI Personality</label>
                    <select id="personalityPreset">
                        <option value="default">Default Assistant</option>
                        <option value="genz">Gen-Z / Chill</option>
                        <option value="coder">Expert Coder</option>
                        <option value="sarcastic">Sarcastic</option>
                        <option value="custom">Custom Instructions</option>
                    </select>
                </div>
                <div class="form-group" id="customPromptGroup" style="display: none;">
                    <label for="customSystemPrompt">Custom System Instructions</label>
                    <textarea id="customSystemPrompt" placeholder="Enter custom AI behavior..."></textarea>
                </div>
                <div class="form-group">
                    <label for="themePreset">Theme</label>
                    <select id="themePreset">
                        <option value="default">Dark (Default)</option>
                        <option value="modern">Slate Modern</option>
                        <option value="midnight">Midnight Blue</option>
                        <option value="light">Light Mode</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="panicKeyInput">Panic Key (Press anytime to redirect to Google)</label>
                    <select id="panicKeyInput">
                        <option value="None">None</option>
                        <option value="Escape">Escape</option>
                        <option value="`">Backtick (`)</option>
                        <option value="Tab">Tab</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN ENGINE SCRIPT -->
    <script>
        // ---> PUT YOUR GROQ API KEY HERE <---
        const GROQ_API_KEY = "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";
        const GROQ_MODEL = "meta-llama/llama-prompt-guard-2-86m";

        const PERSONALITIES = {
            default: "You are a helpful, clear, and concise AI assistant.",
            genz: "You talk like a chilled out Gen-Z internet user. Keep it brief, authentic, and modern.",
            coder: "You are an elite software engineer. Provide clean, efficient code and precise technical explanations.",
            sarcastic: "You are a witty, mildly sarcastic assistant who gives accurate answers with a touch of dry humor."
        };

        const THEMES = {
            default: { bg: '#191919', text: '#ffffff' },
            modern: { bg: '#0f172a', text: '#f8fafc' },
            midnight: { bg: '#0b132b', text: '#ffffff' },
            light: { bg: '#f1f5f9', text: '#0f172a' }
        };

        // State Management
        let chats = JSON.parse(localStorage.getItem('ai_chats') || '[]');
        let activeChatId = localStorage.getItem('ai_active_chat_id') || null;

        if (chats.length === 0) {
            createNewChat(false);
        } else if (!chats.some(c => c.id === activeChatId)) {
            activeChatId = chats[0].id;
        }

        // DOM Elements
        const sidebar = document.getElementById('sidebar');
        const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
        const chatList = document.getElementById('chatList');
        const newChatBtn = document.getElementById('newChatBtn');
        const messagesContainer = document.getElementById('messagesContainer');
        const emptyState = document.getElementById('emptyState');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        
        const settingsModal = document.getElementById('settingsModal');
        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const personalityPreset = document.getElementById('personalityPreset');
        const customPromptGroup = document.getElementById('customPromptGroup');
        const customSystemPrompt = document.getElementById('customSystemPrompt');
        const themePreset = document.getElementById('themePreset');
        const panicKeyInput = document.getElementById('panicKeyInput');

        let isGenerating = false;
        let currentAbortController = null;

        // Theme and Settings Initialization
        function applySettings() {
            const themeKey = localStorage.getItem('ai_theme') || 'default';
            const theme = THEMES[themeKey] || THEMES.default;
            document.documentElement.style.setProperty('--bg-color', theme.bg);
            document.documentElement.style.setProperty('--text-color', theme.text);
            themePreset.value = themeKey;

            const pers = localStorage.getItem('ai_personality') || 'default';
            personalityPreset.value = pers;
            if (pers === 'custom') {
                customPromptGroup.style.display = 'flex';
                customSystemPrompt.value = localStorage.getItem('ai_custom_prompt') || '';
            } else {
                customPromptGroup.style.display = 'none';
            }

            panicKeyInput.value = localStorage.getItem('ai_panic_key') || 'None';
        }

        applySettings();

        themePreset.addEventListener('change', (e) => {
            localStorage.setItem('ai_theme', e.target.value);
            applySettings();
        });

        personalityPreset.addEventListener('change', (e) => {
            localStorage.setItem('ai_personality', e.target.value);
            if (e.target.value === 'custom') {
                customPromptGroup.style.display = 'flex';
            } else {
                customPromptGroup.style.display = 'none';
            }
        });

        customSystemPrompt.addEventListener('input', (e) => {
            localStorage.setItem('ai_custom_prompt', e.target.value);
        });

        panicKeyInput.addEventListener('change', (e) => {
            localStorage.setItem('ai_panic_key', e.target.value);
        });

        // Modal Toggles
        openSettingsBtn.addEventListener('click', () => settingsModal.classList.add('open'));
        closeSettingsBtn.addEventListener('click', () => settingsModal.classList.remove('open'));
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) settingsModal.classList.remove('open');
        });

        toggleSidebarBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });

        // Panic Key listener
        window.addEventListener('keydown', (e) => {
            const panicKey = localStorage.getItem('ai_panic_key');
            if (panicKey && panicKey !== 'None') {
                if (e.key === panicKey || (panicKey === 'Escape' && e.key === 'Escape')) {
                    window.location.href = 'https://www.google.com';
                }
            }
        });

        // Chat Management
        function saveChats() {
            localStorage.setItem('ai_chats', JSON.stringify(chats));
            localStorage.setItem('ai_active_chat_id', activeChatId);
        }

        function createNewChat(render = true) {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'New Conversation',
                messages: []
            };
            chats.unshift(newChat);
            activeChatId = newChat.id;
            saveChats();
            if (render) {
                renderSidebar();
                renderMessages();
            }
        }

        newChatBtn.addEventListener('click', () => createNewChat(true));

        function renderSidebar() {
            chatList.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `chat-item ${chat.id === activeChatId ? 'active' : ''}`;
                
                const titleSpan = document.createElement('span');
                titleSpan.className = 'chat-item-title';
                titleSpan.textContent = chat.title;
                titleSpan.addEventListener('click', () => {
                    activeChatId = chat.id;
                    saveChats();
                    renderSidebar();
                    renderMessages();
                });

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'chat-item-delete';
                deleteBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    chats = chats.filter(c => c.id !== chat.id);
                    if (chats.length === 0) {
                        createNewChat(false);
                    } else if (activeChatId === chat.id) {
                        activeChatId = chats[0].id;
                    }
                    saveChats();
                    renderSidebar();
                    renderMessages();
                });

                item.appendChild(titleSpan);
                item.appendChild(deleteBtn);
                chatList.appendChild(item);
            });
        }

        function renderMessages() {
            messagesContainer.innerHTML = '';
            const activeChat = chats.find(c => c.id === activeChatId);
            
            if (!activeChat || activeChat.messages.length === 0) {
                messagesContainer.appendChild(emptyState);
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            activeChat.messages.forEach(msg => {
                appendMessageNode(msg.role, msg.content);
            });
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function appendMessageNode(role, content) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role === 'user' ? 'user' : 'assistant'}`;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            if (role === 'assistant') {
                bubble.innerHTML = formatMarkdown(content);
            } else {
                bubble.textContent = content;
            }

            msgDiv.appendChild(bubble);
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return bubble;
        }

        // Simple lightweight markdown formatter for code blocks and text
        function formatMarkdown(text) {
            // Escape HTML entities to prevent injection
            let safe = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            // Code blocks
            safe = safe.replace(/```([\s\S]*?)```/g, (match, code) => {
                return `<pre><code>${code.trim()}</code></pre>`;
            });

            // Inline code
            safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Bold
            safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

            // Paragraphs / line breaks
            safe = safe.replace(/\n/g, '<br>');

            return safe;
        }

        // Textarea Auto-resize
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSendMessage();
            }
        });

        sendBtn.addEventListener('click', handleSendMessage);

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text || isGenerating) return;

            if (GROQ_API_KEY === "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" || !GROQ_API_KEY) {
                alert("Please put your Groq API key inside the code (GROQ_API_KEY variable).");
                return;
            }

            userInput.value = '';
            userInput.style.height = 'auto';

            const activeChat = chats.find(c => c.id === activeChatId);
            if (!activeChat) return;

            // Update chat title if first message
            if (activeChat.messages.length === 0) {
                activeChat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
                renderSidebar();
            }

            activeChat.messages.push({ role: 'user', content: text });
            saveChats();
            renderMessages();

            isGenerating = true;
            sendBtn.disabled = true;

            // Prepare system prompt
            const persKey = localStorage.getItem('ai_personality') || 'default';
            let systemPrompt = PERSONALITIES[persKey] || PERSONALITIES.default;
            if (persKey === 'custom') {
                systemPrompt = localStorage.getItem('ai_custom_prompt') || PERSONALITIES.default;
            }

            const apiMessages = [
                { role: 'system', content: systemPrompt },
                ...activeChat.messages.map(m => ({ role: m.role, content: m.content }))
            ];

            const assistantBubble = appendMessageNode('assistant', '');
            let fullResponseText = '';

            currentAbortController = new AbortController();

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${GROQ_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: GROQ_MODEL,
                        messages: apiMessages,
                        stream: true
                    }),
                    signal: currentAbortController.signal
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `API Error (${response.status})`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // keep trailing incomplete line

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed.startsWith('data:')) continue;
                        const dataStr = trimmed.replace('data:', '').trim();
                        if (dataStr === '[DONE]') continue;

                        try {
                            const parsed = JSON.parse(dataStr);
                            const delta = parsed.choices?.[0]?.delta?.content || '';
                            if (delta) {
                                fullResponseText += delta;
                                assistantBubble.innerHTML = formatMarkdown(fullResponseText);
                                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                            }
                        } catch (err) {
                            // JSON parse error on chunk, ignore
                        }
                    }
                }

                activeChat.messages.push({ role: 'assistant', content: fullResponseText });
                saveChats();

            } catch (err) {
                if (err.name !== 'AbortError') {
                    fullResponseText = `Error: ${err.message}`;
                    assistantBubble.textContent = fullResponseText;
                }
            } finally {
                isGenerating = false;
                sendBtn.disabled = false;
                currentAbortController = null;
            }
        }

        // Initial render
        renderSidebar();
        renderMessages();
    </script>

</body>
</html>
