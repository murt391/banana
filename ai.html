<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg-color: #191919;
            --accent-color: #ffed85;
            --text-color: #ffffff;
            --subtext-color: rgb(120, 120, 120);
            --glass-bg: rgba(35, 35, 35, 0.85);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif !important;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Glassmorphism Helper */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }

        /* Announcement Ticker Styling */
        .announcement-bar {
            position: relative;
            height: 44px;
            flex: 1;
            display: flex;
            align-items: center;
            overflow: hidden;
            pointer-events: none;
            -webkit-mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
            mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
        }

        .announcement-text {
            position: absolute;
            white-space: nowrap;
            color: var(--accent-color);
            font-size: 1.15rem;
            font-weight: bold;
            animation: slideLeftWithPause 25s linear infinite;
        }

        @keyframes slideLeftWithPause {
            0% {
                left: 100%;
                transform: translateX(0%);
            }
            80%, 100% {
                left: 0%;
                transform: translateX(-100%);
            }
        }

        /* Top Buttons */
        .top-icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            color: var(--accent-color);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
            flex-shrink: 0;
        }

        .top-icon-btn:hover {
            transform: scale(1.12);
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-color);
        }

        .top-settings-btn:hover {
            transform: scale(1.15) rotate(30deg);
            background: rgba(255, 237, 133, 0.2);
            border-color: var(--accent-color);
        }

        /* Sidebar Transitions */
        #sidebar {
            width: 280px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 20;
        }

        #sidebar.collapsed {
            margin-left: -280px;
        }

        @media (max-width: 768px) {
            #sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                margin-left: 0 !important;
            }
            #sidebar.collapsed {
                transform: translateX(-100%);
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }

        /* Markdown Content Styling inside AI Bubbles */
        .markdown-body p {
            margin-bottom: 0.65rem;
        }
        .markdown-body p:last-child {
            margin-bottom: 0;
        }
        .markdown-body pre {
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px 14px;
            overflow-x: auto;
            margin: 8px 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
            font-size: 0.875rem;
            color: #e2e8f0;
        }
        .markdown-body code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
            background: rgba(0, 0, 0, 0.35);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 0.875em;
            color: var(--accent-color);
        }
        .markdown-body pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }
        .markdown-body ul, .markdown-body ol {
            padding-left: 1.4rem;
            margin-bottom: 0.65rem;
        }
        .markdown-body ul { list-style-type: disc; }
        .markdown-body ol { list-style-type: decimal; }
        .markdown-body strong {
            color: var(--accent-color);
        }

        /* Typing Dots Animation */
        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-color);
            animation: bounceDot 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounceDot {
            0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Input Auto-resize */
        #chatInput {
            resize: none;
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>

            midnight:{ name: 'Midnight', bg: '#0b132b', accent: '#6fffe9', text: '#ffffff' },
            light:   { name: 'Light', bg: '#f1f5f9', accent: '#2563eb', text: '#0f172a' },
            lime:    { name: 'Lime', bg: '#1a2e05', accent: '#a3e635', text: '#ecfdf5' },
            kiwi:    { name: 'Kiwi', bg: '#14281d', accent: '#4ade80', text: '#f0fdf4' },
            cherax:  { name: 'Cherax', bg: '#200010', accent: '#ff0055', text: '#ffccdf' },
            retro:   { name: 'Retro', bg: '#2b1e1a', accent: '#fb923c', text: '#fef3c7' }
        };

        const PERSONALITIES = {
            default: {
                name: "Default Chill",
                prompt: "You are a chill, friendly, and helpful assistant. Keep answers clear, direct, and easy to read."
            },
            tuff: {
                name: "Tuff / Gen-Z",
                prompt: "You are a Gen-Z assistant. Speak casually using modern internet slang like 'tuff', 'peak', 'lowkey', 'fr', 'no cap', 'locked in', and 'bet', while still giving accurate and helpful answers."
            },
            coder: {
                name: "Genius Coder",
                prompt: "You are a Senior Software Engineer. Provide clean, well-commented, optimal code examples, explain architecture clearly, and format code in markdown blocks."
            },
            pirate: {
                name: "Pirate",
                prompt: "You are a swashbuckling pirate sailing the digital seas! Use pirate lingo ('Ahoy', 'matey', 'shiver me timbers') while answering questions accurately."
            },
            sarcastic: {
                name: "Sarcastic",
                prompt: "You have a dry, witty, and playfully sarcastic sense of humor. Tease the user lightly for obvious questions, yet always provide the genuinely correct and helpful answer."
            },
            concise: {
                name: "Ultra Concise",
                prompt: "Answer every question as briefly and directly as possible with zero fluff or filler words."
            },
            custom: {
                name: "Custom",
                prompt: ""
            }
        };

        // ==========================================
        // 2. APPLICATION STATE
        // ==========================================
        let chats = [];
        let activeChatId = null;
        let isGenerating = false;
        let activeAbortController = null;
        let renamingChatId = null;
        let isRecordingPanicKey = false;

        // ==========================================
        // 3. INITIALIZATION & THEME / SETTINGS ENGINE
        // ==========================================
        function initApp() {
            applyTheme();
            applyAnnouncement();
            loadChats();
            updateSidebarPersonalityLabel();
            setupInputHandlers();

            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('collapsed');
            }
        }

        function applyTheme() {
            const preset = localStorage.getItem('site_theme_preset') || 'default';
            let bg, accent, text;

            if (preset !== 'custom' && THEMES[preset]) {
                bg = THEMES[preset].bg;
                accent = THEMES[preset].accent;
                text = THEMES[preset].text;
            } else {
                bg = localStorage.getItem('site_bg') || '#191919';
                accent = localStorage.getItem('site_accent') || '#ffed85';
                text = localStorage.getItem('site_text') || '#ffffff';
            }

            document.documentElement.style.setProperty('--bg-color', bg);
            document.documentElement.style.setProperty('--accent-color', accent);
            document.documentElement.style.setProperty('--text-color', text);

            if (preset === 'light' || isLightColor(bg)) {
                document.documentElement.style.setProperty('--glass-bg', 'rgba(255, 255, 255, 0.85)');
                document.documentElement.style.setProperty('--glass-border', 'rgba(0, 0, 0, 0.12)');
            } else {
                document.documentElement.style.setProperty('--glass-bg', 'rgba(35, 35, 35, 0.85)');
                document.documentElement.style.setProperty('--glass-border', 'rgba(255, 255, 255, 0.12)');
            }
        }

        function isLightColor(hex) {
            if (!hex || !hex.startsWith('#') || hex.length < 7) return false;
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness > 155;
        }

        function applyAnnouncement() {
            const announcementBar = document.getElementById('announcementBar');
            const announcementSpacer = document.getElementById('announcementSpacer');
            const announcementTextDisplay = document.getElementById('announcementTextDisplay');
            
            const savedText = localStorage.getItem('site_announcement_text');
            const activeText = (savedText !== null && savedText.trim() !== '') ? savedText : DEFAULT_ANNOUNCEMENT;
            announcementTextDisplay.textContent = activeText;

            const savedAnnouncementState = localStorage.getItem('site_announcement_enabled');
            const isAnnouncementOn = savedAnnouncementState === null ? true : (savedAnnouncementState === 'true');
            
            if (isAnnouncementOn && activeText !== "") {
                announcementBar.style.display = 'flex';
                announcementSpacer.classList.add('hidden');
            } else {
                announcementBar.style.display = 'none';
                announcementSpacer.classList.remove('hidden');
            }
        }

        function getActiveGroqModel() {
            return localStorage.getItem('site_groq_model') || DEFAULT_GROQ_MODEL;
        }

        // Panic Key Listener
        window.addEventListener('keydown', (e) => {
            if (isRecordingPanicKey) {
                e.preventDefault();
                const keyName = e.key === ' ' ? 'Space' : e.key;
                localStorage.setItem('site_panic_key', keyName);
                document.getElementById('panicKeyBtn').textContent = keyName;
                isRecordingPanicKey = false;
                return;
            }

            const tag = document.activeElement.tagName.toLowerCase();
            if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

            const panicKey = localStorage.getItem('site_panic_key');
            if (panicKey && panicKey !== 'None' && e.key === panicKey) {
                window.location.href = 'https://www.google.com';
            }
        });

        // ==========================================
        // 4. CHAT TABS & STORAGE MANAGEMENT
        // ==========================================
        function loadChats() {
            try {
                const saved = localStorage.getItem('groq_ai_chats');
                chats = saved ? JSON.parse(saved) : [];
            } catch (e) {
                chats = [];
            }

            if (chats.length === 0) {
                createNewTab(false);
            } else {
                const savedActive = localStorage.getItem('groq_ai_active_tab');
                activeChatId = chats.some(c => c.id === savedActive) ? savedActive : chats[0].id;
            }
            renderTabs();
            renderActiveChat();
        }

        function saveChats() {
            localStorage.setItem('groq_ai_chats', JSON.stringify(chats));
            if (activeChatId) {
                localStorage.setItem('groq_ai_active_tab', activeChatId);
            }
        }

        function createNewTab(closeMobileSidebar = true) {
            if (isGenerating) stopGeneration();
            const newChat = {
                id: 'chat_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                title: 'New Chat',
                messages: [],
                updatedAt: Date.now()
            };
            chats.unshift(newChat);
            activeChatId = newChat.id;
            saveChats();
            renderTabs();
            renderActiveChat();

            if (closeMobileSidebar && window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('collapsed');
                document.getElementById('mobileBackdrop').classList.add('hidden');
            }
            document.getElementById('chatInput').focus();
        }

        function switchTab(id) {
            if (activeChatId === id) return;
            if (isGenerating) stopGeneration();
            activeChatId = id;
            saveChats();
            renderTabs();
            renderActiveChat();

            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('collapsed');
                document.getElementById('mobileBackdrop').classList.add('hidden');
            }
        }

        function deleteTab(e, id) {
            e.stopPropagation();
            if (isGenerating && activeChatId === id) stopGeneration();
            chats = chats.filter(c => c.id !== id);
            if (chats.length === 0) {
                createNewTab(false);
                return;
            }
            if (activeChatId === id) {
                activeChatId = chats[0].id;
            }
            saveChats();
            renderTabs();
            renderActiveChat();
        }

        function clearAllChats() {
            if (isGenerating) stopGeneration();
            chats = [];
            createNewTab(false);
        }

        function openRenameModal(e, id) {
            e.stopPropagation();
            const chat = chats.find(c => c.id === id);
            if (!chat) return;
            renamingChatId = id;
            const input = document.getElementById('renameInput');
            input.value = chat.title;
            document.getElementById('renameModal').classList.remove('hidden');
            document.getElementById('renameModal').classList.add('flex');
            input.focus();
            input.select();
        }

        function closeRenameModal() {
            renamingChatId = null;
            document.getElementById('renameModal').classList.add('hidden');
            document.getElementById('renameModal').classList.remove('flex');
        }

        function confirmRenameTab() {
            const val = document.getElementById('renameInput').value.trim();
            if (val && renamingChatId) {
                const chat = chats.find(c => c.id === renamingChatId);
                if (chat) {
                    chat.title = val;
                    saveChats();
                    renderTabs();
                }
            }
            closeRenameModal();
        }

        document.getElementById('renameInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') confirmRenameTab();
            if (e.key === 'Escape') closeRenameModal();
        });

        function renderTabs() {
            const list = document.getElementById('tabsList');
            list.innerHTML = '';

            chats.forEach(chat => {
                const isActive = chat.id === activeChatId;
                const item = document.createElement('div');
                item.onclick = () => switchTab(chat.id);
                item.className = `group flex items-center justify-between gap-2 px-3 py-2.5 rounded-2xl cursor-pointer transition border ${
                    isActive 
                        ? 'bg-white/15 border-white/20 font-bold' 
                        : 'bg-transparent border-transparent hover:bg-white/5 opacity-80 hover:opacity-100'
                }`;
                if (isActive) {
                    item.style.borderColor = 'var(--accent-color)';
                }

                item.innerHTML = `
                    <div class="flex items-center gap-2.5 min-w-0 flex-1">
                        <svg class="w-4 h-4 shrink-0 opacity-75" style="color: ${isActive ? 'var(--accent-color)' : 'currentColor'};" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <span class="truncate text-sm" style="color: ${isActive ? 'var(--accent-color)' : 'var(--text-color)'};">${escapeHtml(chat.title)}</span>
                    </div>
                    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition shrink-0">
                        <button type="button" onclick="openRenameModal(event, '${chat.id}')" class="p-1 rounded-lg hover:bg-white/15 cursor-pointer" title="Rename">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                        </button>
                        <button type="button" onclick="deleteTab(event, '${chat.id}')" class="p-1 rounded-lg hover:bg-red-500/20 text-red-400 cursor-pointer" title="Delete Tab">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('mobileBackdrop');
            sidebar.classList.toggle('collapsed');

            if (window.innerWidth < 768) {
                if (sidebar.classList.contains('collapsed')) {
                    backdrop.classList.add('hidden');
                } else {
                    backdrop.classList.remove('hidden');
                }
            }
        }

        // ==========================================
        // 5. CHAT RENDERING & GROQ STREAMING API
        // ==========================================
        function renderActiveChat() {
            const chat = chats.find(c => c.id === activeChatId);
            const emptyHero = document.getElementById('emptyHero');
            const chatContainer = document.getElementById('chatMessagesContainer');
            const msgList = document.getElementById('chatMessagesList');

            if (!chat || chat.messages.length === 0) {
                emptyHero.classList.remove('hidden');
                chatContainer.classList.add('hidden');
                msgList.innerHTML = '';
                return;
            }

            emptyHero.classList.add('hidden');
            chatContainer.classList.remove('hidden');
            msgList.innerHTML = '';

            chat.messages.forEach(msg => {
                appendMessageBubble(msg.role, msg.text, false);
            });

            scrollToBottom();
        }

        function appendMessageBubble(role, text, animateScroll = true) {
            const msgList = document.getElementById('chatMessagesList');
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'}`;

            if (role === 'user') {
                wrapper.innerHTML = `
                    <div class="max-w-[82%] sm:max-w-[75%] rounded-3xl rounded-br-md px-5 py-3 text-base break-words whitespace-pre-wrap" 
                         style="background-color: var(--accent-color); color: #191919; font-weight: bold;">${escapeHtml(text)}</div>
                `;
            } else {
                const renderedHtml = typeof marked !== 'undefined' ? marked.parse(text) : escapeHtml(text);
                wrapper.innerHTML = `
                    <div class="glass-panel rounded-3xl rounded-tl-md px-5 py-3.5 text-base markdown-body break-words max-w-[90%] sm:max-w-[82%]" style="color: var(--text-color);">
                        ${renderedHtml}
                    </div>
                `;
            }

            msgList.appendChild(wrapper);
            if (animateScroll) scrollToBottom();
            return wrapper.querySelector('.markdown-body');
        }

        function showTypingIndicator() {
            const msgList = document.getElementById('chatMessagesList');
            const indicator = document.createElement('div');
            indicator.id = 'aiTypingIndicator';
            indicator.className = 'flex justify-start';
            indicator.innerHTML = `
                <div class="glass-panel rounded-3xl rounded-tl-md px-5 py-4 flex items-center gap-1.5">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            msgList.appendChild(indicator);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('aiTypingIndicator');
            if (indicator) indicator.remove();
        }

        function scrollToBottom() {
            const container = document.getElementById('chatMessagesContainer');
            container.scrollTop = container.scrollHeight;
        }

        function setGeneratingState(generating) {
            isGenerating = generating;
            const sendIcon = document.getElementById('sendIcon');
            const stopIcon = document.getElementById('stopIcon');
            const sendBtn = document.getElementById('sendBtn');

            if (generating) {
                sendIcon.classList.add('hidden');
                stopIcon.classList.remove('hidden');
                sendBtn.title = 'Stop';
                sendBtn.setAttribute('aria-label', 'Stop Generating');
            } else {
                sendIcon.classList.remove('hidden');
                stopIcon.classList.add('hidden');
                sendBtn.title = 'Send';
                sendBtn.setAttribute('aria-label', 'Send Message');
            }
        }

        function stopGeneration() {
            if (activeAbortController) {
                activeAbortController.abort();
                activeAbortController = null;
            }
            removeTypingIndicator();
            setGeneratingState(false);
        }

        async function handleSendMessage() {
            if (isGenerating) {
                stopGeneration();
                return;
            }

            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            let chat = chats.find(c => c.id === activeChatId);
            if (!chat) {
                createNewTab(false);
                chat = chats.find(c => c.id === activeChatId);
            }

            // Auto-title tab on first message
            if (chat.messages.length === 0) {
                chat.title = text.length > 28 ? text.substring(0, 28) + '...' : text;
                document.getElementById('emptyHero').classList.add('hidden');
                document.getElementById('chatMessagesContainer').classList.remove('hidden');
            }

            // Add user message
            chat.messages.push({ role: 'user', text });
            chat.updatedAt = Date.now();
            saveChats();
            renderTabs();
            appendMessageBubble('user', text);

            // Reset input
            input.value = '';
            input.style.height = 'auto';

            // Check hardcoded key
            const apiKey = (typeof GROQ_API_KEY === 'string') ? GROQ_API_KEY.trim() : '';
            if (!apiKey || apiKey === 'YOUR_GROQ_API_KEY_HERE') {
                const missingMsg = "API key isn't set in the code yet. Open `index.html` and put your Groq API key in `GROQ_API_KEY` at the top of the `<script>` tag.";
                chat.messages.push({ role: 'assistant', text: missingMsg });
                saveChats();
                appendMessageBubble('assistant', missingMsg, true);
                return;
            }

            // Start streaming
            setGeneratingState(true);
            showTypingIndicator();
            activeAbortController = new AbortController();

            let fullReply = '';
            let bubbleContentEl = null;

            try {
                await streamGroqResponse(apiKey, chat.messages, activeAbortController.signal, (chunkText) => {
                    if (!bubbleContentEl) {
                        removeTypingIndicator();
                        bubbleContentEl = appendMessageBubble('assistant', '', true);
                    }
                    fullReply += chunkText;
                    bubbleContentEl.innerHTML = typeof marked !== 'undefined' ? marked.parse(fullReply) : escapeHtml(fullReply);
                    scrollToBottom();
                });

                removeTypingIndicator();
                if (fullReply) {
                    chat.messages.push({ role: 'assistant', text: fullReply });
                    chat.updatedAt = Date.now();
                    saveChats();
                }
            } catch (err) {
                removeTypingIndicator();
                if (err.name === 'AbortError') {
                    if (fullReply) {
                        chat.messages.push({ role: 'assistant', text: fullReply });
                        chat.updatedAt = Date.now();
                        saveChats();
                    }
                } else {
                    const errMsg = `Error: ${err.message || 'Could not reach Groq API.'}`;
                    chat.messages.push({ role: 'assistant', text: errMsg });
                    saveChats();
                    appendMessageBubble('assistant', errMsg, true);
                }
            } finally {
                activeAbortController = null;
                setGeneratingState(false);
                input.focus();
            }
        }

        async function streamGroqResponse(apiKey, messagesHistory, signal, onToken) {
            const endpoint = 'https://api.groq.com/openai/v1/chat/completions';
            const model = getActiveGroqModel();

            const presetKey = localStorage.getItem('ai_personality_preset') || 'default';
            const customPrompt = localStorage.getItem('ai_system_prompt');
            const systemInstructionText = (customPrompt && customPrompt.trim() !== '')
                ? customPrompt
                : (PERSONALITIES[presetKey]?.prompt || PERSONALITIES.default.prompt);

            const formattedMessages = [
                { role: 'system', content: systemInstructionText },
                ...messagesHistory.map(m => ({
                    role: m.role === 'user' ? 'user' : 'assistant',
                    content: m.text
                }))
            ];

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: model,
                    messages: formattedMessages,
                    stream: true
                }),
                signal
            });

            if (!response.ok) {
                let errDetail = `HTTP ${response.status}`;
                try {
                    const errJson = await response.json();
                    if (errJson?.error?.message) {
                        errDetail = errJson.error.message;
                    }
                } catch (_) {}
                throw new Error(errDetail);
            }

            if (!response.body) {
                const data = await response.json();
                const text = data?.choices?.[0]?.message?.content || '';
                if (text) onToken(text);
                return;
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed || !trimmed.startsWith('data:')) continue;
                    const dataStr = trimmed.slice(5).trim();
                    if (dataStr === '[DONE]') return;

                    try {
                        const parsed = JSON.parse(dataStr);
                        const delta = parsed?.choices?.[0]?.delta?.content;
                        if (delta) {
                            onToken(delta);
                        }
                    } catch (_) {}
                }
            }
        }

        function setupInputHandlers() {
            const textarea = document.getElementById('chatInput');
            const sendBtn = document.getElementById('sendBtn');

            sendBtn.addEventListener('click', (e) => {
                e.preventDefault();
                handleSendMessage();
            });

            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 150) + 'px';
            });

            textarea.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSendMessage();
                }
            });
        }

        // ==========================================
        // 6. SETTINGS MODAL LOGIC
        // ==========================================
        function openSettings(defaultTab = 'personality') {
            populateSettingsUI();
            switchSettingsTab(defaultTab);
            const modal = document.getElementById('settingsModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeSettings() {
            isRecordingPanicKey = false;
            const modal = document.getElementById('settingsModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function switchSettingsTab(tabName) {
            ['personality', 'themes', 'extras'].forEach(t => {
                const btn = document.getElementById(`tabBtn-${t}`);
                const sec = document.getElementById(`settingsSec-${t}`);
                if (t === tabName) {
                    btn.style.borderColor = 'var(--accent-color)';
                    btn.style.color = 'var(--accent-color)';
                    btn.classList.remove('opacity-60');
                    sec.classList.remove('hidden');
                } else {
                    btn.style.borderColor = 'transparent';
                    btn.style.color = 'var(--text-color)';
                    btn.classList.add('opacity-60');
                    sec.classList.add('hidden');
                }
            });
        }

        function populateSettingsUI() {
            // 1. Model Selection
            const modelSelect = document.getElementById('groqModelSelect');
            modelSelect.value = getActiveGroqModel();

            // 2. Personality Presets
            const pGrid = document.getElementById('personalityPresetsGrid');
            pGrid.innerHTML = '';
            const currentPreset = localStorage.getItem('ai_personality_preset') || 'default';
            const currentPrompt = localStorage.getItem('ai_system_prompt') || PERSONALITIES[currentPreset]?.prompt || PERSONALITIES.default.prompt;

            Object.entries(PERSONALITIES).forEach(([key, data]) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                const isSelected = key === currentPreset;
                btn.className = `px-3 py-2.5 rounded-2xl text-xs font-bold border transition cursor-pointer text-center ${
                    isSelected ? 'bg-white/15' : 'bg-black/30 hover:bg-white/10 border-white/10'
                }`;
                if (isSelected) {
                    btn.style.borderColor = 'var(--accent-color)';
                    btn.style.color = 'var(--accent-color)';
                }
                btn.textContent = data.name;
                btn.onclick = () => {
                    localStorage.setItem('ai_personality_preset', key);
                    if (key !== 'custom') {
                        document.getElementById('customSystemPromptInput').value = data.prompt;
                        localStorage.setItem('ai_system_prompt', data.prompt);
                    }
                    populateSettingsUI();
                    updateSidebarPersonalityLabel();
                };
                pGrid.appendChild(btn);
            });

            const promptBox = document.getElementById('customSystemPromptInput');
            promptBox.value = currentPrompt;
            promptBox.oninput = () => {
                localStorage.setItem('ai_personality_preset', 'custom');
                localStorage.setItem('ai_system_prompt', promptBox.value);
                updateSidebarPersonalityLabel();
            };

            // 3. Theme Presets
            const tGrid = document.getElementById('themePresetsGrid');
            tGrid.innerHTML = '';
            const activeTheme = localStorage.getItem('site_theme_preset') || 'default';

            Object.entries(THEMES).forEach(([key, theme]) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                const isSelected = key === activeTheme;
                btn.className = `p-2.5 rounded-2xl border transition cursor-pointer flex items-center gap-2 ${
                    isSelected ? 'scale-[1.03]' : 'opacity-80 hover:opacity-100'
                }`;
                btn.style.backgroundColor = theme.bg;
                btn.style.color = theme.text;
                btn.style.borderColor = isSelected ? theme.accent : 'rgba(255,255,255,0.15)';
                btn.innerHTML = `
                    <span class="w-4 h-4 rounded-full shrink-0" style="background-color: ${theme.accent};"></span>
                    <span class="text-xs font-bold truncate">${theme.name}</span>
                `;
                btn.onclick = () => {
                    localStorage.setItem('site_theme_preset', key);
                    applyTheme();
                    populateSettingsUI();
                };
                tGrid.appendChild(btn);
            });

            // Custom Color Pickers
            const bgPicker = document.getElementById('customBgPicker');
            const accentPicker = document.getElementById('customAccentPicker');
            const textPicker = document.getElementById('customTextPicker');

            bgPicker.value = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim() || '#191919';
            accentPicker.value = getComputedStyle(document.documentElement).getPropertyValue('--accent-color').trim() || '#ffed85';
            textPicker.value = getComputedStyle(document.documentElement).getPropertyValue('--text-color').trim() || '#ffffff';

            const handleCustomColor = () => {
                localStorage.setItem('site_theme_preset', 'custom');
                localStorage.setItem('site_bg', bgPicker.value);
                localStorage.setItem('site_accent', accentPicker.value);
                localStorage.setItem('site_text', textPicker.value);
                applyTheme();
            };
            bgPicker.oninput = handleCustomColor;
            accentPicker.oninput = handleCustomColor;
            textPicker.oninput = handleCustomColor;

            // 4. Extras & Panic Key
            const savedAnn = localStorage.getItem('site_announcement_enabled');
            document.getElementById('announcementToggle').checked = savedAnn === null ? true : (savedAnn === 'true');
            document.getElementById('customAnnouncementInput').value = localStorage.getItem('site_announcement_text') || DEFAULT_ANNOUNCEMENT;
            document.getElementById('panicKeyBtn').textContent = localStorage.getItem('site_panic_key') || 'None';
        }

        function recordPanicKey() {
            isRecordingPanicKey = true;
            document.getElementById('panicKeyBtn').textContent = 'Press key...';
        }

        function saveAndCloseSettings() {
            localStorage.setItem('site_groq_model', document.getElementById('groqModelSelect').value);
            localStorage.setItem('ai_system_prompt', document.getElementById('customSystemPromptInput').value);

            const annChecked = document.getElementById('announcementToggle').checked;
            localStorage.setItem('site_announcement_enabled', annChecked ? 'true' : 'false');
            localStorage.setItem('site_announcement_text', document.getElementById('customAnnouncementInput').value);

            applyAnnouncement();
            updateSidebarPersonalityLabel();
            closeSettings();
        }

        function updateSidebarPersonalityLabel() {
            const presetKey = localStorage.getItem('ai_personality_preset') || 'default';
            const label = PERSONALITIES[presetKey]?.name || 'Custom';
            document.getElementById('sidebarPersonalityLabel').textContent = `Mode: ${label}`;
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
