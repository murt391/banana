    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color, rgb(25, 25, 25));
            color: var(--text-color, #ffffff);
            overflow: hidden;
            
            display: flex;
            justify-content: center;
            align-items: center;
            
            font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif !important;
            
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        #dotCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            pointer-events: none;
            text-align: center;
        }

        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: -0.2rem;
        }

        .title-icon {
            width: 7.5rem;
            height: 7.5rem;
            object-fit: contain;
        }

        /* Flipped Favicon Styling */
        .title-icon.flipped {
            transform: scaleX(-1);
        }

        .main-text {
            color: var(--accent-color, #ffed85); /* Accent color preset or custom */
            font-size: 7.5rem;
            font-weight: bold;
            line-height: 1;
        }

        .subtext {
            color: var(--subtext-color, rgb(100, 100, 100));
            font-size: 2rem;
            font-weight: bold;
        }

        /* Top Right Settings Button Styling */
        .top-settings-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 10;
            
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            
            background: rgba(35, 35, 35, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            color: var(--accent-color, #ffed85);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .top-settings-btn:hover {
            transform: scale(1.15) rotate(30deg);
            background: rgba(255, 237, 133, 0.2);
            border-color: var(--accent-color, #ffed85);
        }

        .top-settings-btn svg {
            width: 26px;
            height: 26px;
        }

        /* Floating curved bottom navigation bar */
        .floating-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px; /* Space between icons */
            padding: 10px 20px;
            
            background: rgba(35, 35, 35, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Navigation button styling */
        .nav-item {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--accent-color, #ffed85);
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }

        .nav-item:hover {
            transform: scale(1.15);
            background-color: rgba(255, 237, 133, 0.15);
        }

        .nav-item svg {
            width: 32px;
            height: 32px;
        }
    </style>
</head>

    <!-- SETTINGS INTEGRATION ENGINE -->
    <script>
        (function() {
    // 1. Apply Theme Preset / Custom Colors
    const themes = {
        default: { bg: '#191919', accent: '#ffed85', text: '#ffffff' },
        modern: { bg: '#0f172a', accent: '#38bdf8', text: '#f8fafc' },
        midnight: { bg: '#0b132b', accent: '#6fffe9', text: '#ffffff' },
        light: { bg: '#f1f5f9', accent: '#2563eb', text: '#0f172a' },
        lime: { bg: '#1a2e05', accent: '#a3e635', text: '#ecfdf5' },
        kiwi: { bg: '#14281d', accent: '#4ade80', text: '#f0fdf4' },
        cherax: { bg: '#200010', accent: '#ff0055', text: '#ffccdf' },
        retro: { bg: '#2b1e1a', accent: '#fb923c', text: '#fef3c7' }
    };

    function applyTheme() {
        const preset = localStorage.getItem('site_theme_preset') || 'default';
        let bg, accent, text;

        if (preset !== 'custom' && themes[preset]) {
            bg = themes[preset].bg;
            accent = themes[preset].accent;
            text = themes[preset].text;
        } else {
            bg = localStorage.getItem('site_bg') || '#191919';
            accent = localStorage.getItem('site_accent') || '#ffed85';
            text = localStorage.getItem('site_text') || '#ffffff';
        }

        document.documentElement.style.setProperty('--bg-color', bg);
        document.documentElement.style.setProperty('--accent-color', accent);
        document.documentElement.style.setProperty('--text-color', text);
    }
    applyTheme();

    // 2. Global Background Audio Setup
    let audioEl = document.getElementById('global-bg-audio');
    if (!audioEl) {
        audioEl = document.createElement('audio');
        audioEl.id = 'global-bg-audio';
        audioEl.loop = true;
        document.body.appendChild(audioEl);
    }

    function syncAudio() {
        const track = localStorage.getItem('site_active_music');
        const rawVolume = localStorage.getItem('site_music_volume');
        const volume = rawVolume !== null ? parseFloat(rawVolume) : 0.8;

        // Ensure volume updates immediately
        audioEl.volume = Math.max(0, Math.min(1, volume));

        if (track && track !== 'none') {
            if (audioEl.src !== window.location.origin + '/' + track && audioEl.src !== track) {
                audioEl.src = track;
                audioEl.play().catch(() => {
                    const startAudio = () => {
                        audioEl.play();
                        window.removeEventListener('click', startAudio);
                        window.removeEventListener('keydown', startAudio);
                    };
                    window.addEventListener('click', startAudio);
                    window.addEventListener('keydown', startAudio);
                });
            }
        } else {
            audioEl.pause();
            audioEl.src = '';
        }
    }
    syncAudio();

    // 3. Listen for Storage Changes Across Tabs/Pages
    window.addEventListener('storage', (e) => {
        applyTheme();
        syncAudio();
    });

    // 4. Panic Key Handler
    window.addEventListener('keydown', (e) => {
        const panicKey = localStorage.getItem('site_panic_key');
        if (panicKey && panicKey !== 'None' && e.key === panicKey) {
            window.location.href = 'https://www.google.com';
        }
    });
})();
    </script>

    <!-- UI & CANVAS ANIMATION SCRIPT -->
    <script>
        // Sayings Engine
        const customSubtext = localStorage.getItem('site_subtext');
        const subtextElement = document.getElementById('randomQuote');

        if (customSubtext) {
            subtextElement.textContent = customSubtext;
        } else {
            const sayings = [
                "banana is peak",
                "tuff?",
                "join the discord pleasee",
                "kanel joseph is tuff",
                "the best game site",
                "made by murt"
            ];
            const randomIndex = Math.floor(Math.random() * sayings.length);
            subtextElement.textContent = sayings[randomIndex];
        }

        // Canvas Dot Grid
        const canvas = document.getElementById('dotCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let dots = [];
        
        const gap = 30;
        const radius = 100;
        const mouse = { x: -1000, y: -1000 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initDots();
        }

        function initDots() {
            dots = [];
            for (let x = gap / 2; x < width; x += gap) {
                for (let y = gap / 2; y < height; y += gap) {
                    dots.push({
                        baseX: x,
                        baseY: y,
                        x: x,
                        y: y,
                        vx: 0,
                        vy: 0
                    });
                }
            }
        }

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        window.addEventListener('resize', resize);

        function animate() {
            ctx.clearRect(0, 0, width, height);

            dots.forEach(dot => {
                const dx = mouse.x - dot.x;
                const dy = mouse.y - dot.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < radius) {
                    const angle = Math.atan2(dy, dx);
                    const force = (radius - dist) / radius;
                    const pushX = Math.cos(angle) * force * 12;
                    const pushY = Math.sin(angle) * force * 12;

                    dot.vx -= pushX;
                    dot.vy -= pushY;
                }

                const homeDx = dot.baseX - dot.x;
                const homeDy = dot.baseY - dot.y;
                
                dot.vx += homeDx * 0.08;
                dot.vy += homeDy * 0.08;
                
                dot.vx *= 0.75;
                dot.vy *= 0.75;

                dot.x += dot.vx;
                dot.y += dot.vy;

                ctx.beginPath();
                ctx.arc(dot.x, dot.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        resize();
        animate();
    </script>
