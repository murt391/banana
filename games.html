<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - Banana</title>
    <!-- Site Icon (Favicon) -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/murt391/banana/main/ico.png">
    
    <style>
        /* Fill the full screen and set the background color */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(25, 25, 25);
            font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
            color: #ffffff;
            user-select: none;
            overflow-x: hidden;
        }

        /* Position the canvas behind the page content */
        #dotCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Main container for page content */
        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 120px 20px;
        }

        /* Header styling with total games counter */
        .header {
            display: flex;
            align-items: baseline;
            gap: 15px;
            margin-bottom: 30px;
        }

        .page-title {
            color: #ffed85;
            font-size: 3.5rem;
            font-weight: bold;
            margin: 0;
        }

        .game-count {
            color: rgb(150, 150, 150);
            font-size: 2rem;
            font-weight: bold;
        }

        /* Search input bar */
        .search-bar {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            margin-bottom: 35px;
            background: rgba(35, 35, 35, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 25px;
            color: #ffed85;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* Games Grid System */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: rgba(35, 35, 35, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 15px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .game-card:hover {
            transform: translateY(-5px) scale(1.02);
            background-color: rgba(45, 45, 45, 0.9);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        .game-thumbnail {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
            background-color: #1a1a1a;
        }

        .game-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffed85;
            margin: 0 0 6px 0;
        }

        .game-description {
            font-size: 0.85rem;
            color: rgb(180, 180, 180);
            margin: 0;
            line-height: 1.3;
        }

        /* Floating curved bottom navigation bar */
        .floating-bar {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 10px 20px;
            
            background: rgba(35, 35, 35, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Navigation button styling */
        .nav-item {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: #ffed85;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }

        .nav-item:hover {
            transform: scale(1.15);
            background-color: rgba(255, 237, 133, 0.15);
        }

        .nav-item svg {
            width: 32px;
            height: 32px;
        }
    </style>
</head>
<body>

    <!-- Interactive Dot Canvas Background -->
    <canvas id="dotCanvas"></canvas>
    
    <div class="container">
        <!-- Title & Counter Header -->
        <div class="header">
            <h1 class="page-title">Games</h1>
            <span class="game-count" id="totalGames">(0)</span>
        </div>

        <!-- Search Input -->
        <input type="text" id="searchInput" class="search-bar" placeholder="Search games...">

        <!-- Games Cards Container -->
        <div class="games-grid" id="gamesGrid"></div>
    </div>

    <!-- Floating Curved Bottom Bar -->
    <div class="floating-bar">
        <!-- Home Link Button -->
        <a href="index.html" aria-label="Home" style="text-decoration: none;">
            <button class="nav-item" aria-label="Home">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <!-- 3x3 Dot Grid -->
                    <circle cx="5" cy="5" r="2" />
                    <circle cx="12" cy="5" r="2" />
                    <circle cx="19" cy="5" r="2" />
                    <circle cx="5" cy="12" r="2" />
                    <circle cx="12" cy="12" r="2" />
                    <circle cx="19" cy="12" r="2" />
                    <circle cx="5" cy="19" r="2" />
                    <circle cx="12" cy="19" r="2" />
                    <circle cx="19" cy="19" r="2" />
                </svg>
            </button>
        </a>

        <!-- Controller Icon Button -->
        <a href="games.html" aria-label="Games" style="text-decoration: none;">
            <button class="nav-item" aria-label="Games">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="6" y1="12" x2="10" y2="12"></line>
                    <line x1="8" y1="10" x2="8" y2="14"></line>
                    <circle cx="15" cy="13" r="1" fill="currentColor"></circle>
                    <circle cx="17.5" cy="10.5" r="1" fill="currentColor"></circle>
                    <rect x="2" y="6" width="20" height="12" rx="6"></rect>
                </svg>
            </button>
        </a>
    </div>

    <script>
        // =========================================================
        // GAMES ARRAY & DYNAMIC RENDERING
        // =========================================================
        const games = [
            {
                name: "Gorilla Tag",
                description: "Play as a gorilla and move with WASD. Try to tag other gorillas!",
                file: "Games/gtag.html",
                logo: "https://raw.githubusercontent.com/murt391/banana/main/Games/icons/gtag.png"
            },
            {
                name: "Brawl Stars",
                description: "An isometric game where you play as a brawler, unlock new content, and fight to death in different gamemodes.",
                file: "Games/brawl.html",
                logo: "https://raw.githubusercontent.com/murt391/banana/main/Games/icons/brawl.png"
            }
        ];

        const gamesGrid = document.getElementById('gamesGrid');
        const countDisplay = document.getElementById('totalGames');
        const searchInput = document.getElementById('searchInput');

        // Render game cards dynamically from array
        function renderGames(filterText = '') {
            gamesGrid.innerHTML = '';
            let visibleCount = 0;

            games.forEach(game => {
                if (game.name.toLowerCase().includes(filterText.toLowerCase())) {
                    visibleCount++;
                    const card = document.createElement('a');
                    card.href = game.file;
                    card.className = 'game-card';
                    card.innerHTML = `
                        <img src="${game.logo}" alt="${game.name}" class="game-thumbnail">
                        <h3 class="game-title">${game.name}</h3>
                        <p class="game-description">${game.description}</p>
                    `;
                    gamesGrid.appendChild(card);
                }
            });

            // Update title game counter display
            countDisplay.textContent = `(${visibleCount})`;
        }

        // Live Search Listener
        searchInput.addEventListener('input', (e) => {
            renderGames(e.target.value);
        });

        // Initial rendering of all games
        renderGames();

        // =========================================================
        // CANVAS & INTERACTIVE DOT PATTERN
        // =========================================================
        const canvas = document.getElementById('dotCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let dots = [];
        
        const gap = 30;
        const radius = 100;
        const mouse = { x: -1000, y: -1000 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initDots();
        }

        function initDots() {
            dots = [];
            for (let x = gap / 2; x < width; x += gap) {
                for (let y = gap / 2; y < height; y += gap) {
                    dots.push({
                        baseX: x,
                        baseY: y,
                        x: x,
                        y: y,
                        vx: 0,
                        vy: 0
                    });
                }
            }
        }

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        window.addEventListener('resize', resize);

        function animate() {
            ctx.clearRect(0, 0, width, height);

            dots.forEach(dot => {
                const dx = mouse.x - dot.x;
                const dy = mouse.y - dot.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < radius) {
                    const angle = Math.atan2(dy, dx);
                    const force = (radius - dist) / radius;
                    const pushX = Math.cos(angle) * force * 12;
                    const pushY = Math.sin(angle) * force * 12;

                    dot.vx -= pushX;
                    dot.vy -= pushY;
                }

                const homeDx = dot.baseX - dot.x;
                const homeDy = dot.baseY - dot.y;
                
                dot.vx += homeDx * 0.08;
                dot.vy += homeDy * 0.08;
                
                dot.vx *= 0.75;
                dot.vy *= 0.75;

                dot.x += dot.vx;
                dot.y += dot.vy;

                ctx.beginPath();
                ctx.arc(dot.x, dot.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        resize();
        animate();
    </script>

</body>
</html>
