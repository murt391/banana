name: Automated Mega Bundle

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bundler Tools
        run: npm install -g inliner juice

      - name: Combine All 173 Pages and Images
        run: |
          mkdir dist
          
          # 1. Create a clean base file
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Banana UBG</title><style>.auto-page { display: none; } .auto-page.active { display: block; }</style></head><body>' > dist/raw_combine.html
          
          # 2. Inject navigation control script
          echo '<script>function switchAutoPage(p){document.querySelectorAll(".auto-page").forEach(s=>s.classList.remove("active"));const t=document.getElementById(p);if(t){t.classList.add("active");window.scrollTo(0,0);}}</script>' >> dist/raw_combine.html
          
          # 3. Pack original homepage as the main view
          if [ -f index.html ]; then
            echo '<section id="index.html" class="auto-page active">' >> dist/raw_combine.html
            cat index.html >> dist/raw_combine.html
            echo '</section>' >> dist/raw_combine.html
          fi
          
          # 4. Loop through and inject all other 172 HTML files into their own sections
          find . -type f -name "*.html" ! -name "index.html" ! -path "./dist/*" | while read -r file; do
            clean_id=$(echo "$file" | sed 's|^\./||')
            echo "<section id=\"$clean_id\" class=\"auto-page\">" >> dist/raw_combine.html
            cat "$file" >> dist/raw_combine.html
            echo "</section>" >> dist/raw_combine.html
          done
          
          echo '</body></html>' >> dist/raw_combine.html
          
          # 5. Fix navigation links to handle section shifting
          sed -i -E 's/href="([^"#\:]+\.html)"/href="#" onclick="switchAutoPage(\'\1\'); return false;"/g' dist/raw_combine.html
          
          # 6. Bake all images directly into the HTML as text
          inliner dist/raw_combine.html > dist/index.html

      - name: Preserve Custom Domain CNAME
        run: |
          if [ -f CNAME ]; then
            cp CNAME dist/CNAME
          else
            echo "bananaubg.com" > dist/CNAME
          fi

      - name: Deploy Single File to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
