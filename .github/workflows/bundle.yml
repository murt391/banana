name: Automated Mega Bundle

on:
  push:
    branches:
      - main # Triggers compilation every time you push edits to main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Requirements
        run: pip install beautifulsoup4

      - name: Run Script to Auto-Merge 173 Pages
        run: python bundle.py

      - name: Preserve Custom Domain CNAME
        run: |
          if [ -f CNAME ]; then
            cp CNAME dist/CNAME
          else
            echo "bananaubg.com" > dist/CNAME
          fi

      - name: Deploy Single File to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
